# Dependabot configuration.
#
# Two ecosystems are watched: Composer (the project's PHP dependencies,
# split across the monorepo's per-package composer.json files) and
# github-actions (the workflow's pinned action versions). One PR per
# minor/patch is grouped to avoid noise; security advisories override
# the schedule and ship immediately.
#
# All Dependabot PRs are filed against `main` and require maintainer
# review.

version: 2

updates:
  # ---------------------------------------------------------------
  # PHP — root + every sub-package + every demo app
  # ---------------------------------------------------------------
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - composer
    commit-message:
      prefix: chore
      include: scope
    groups:
      php-runtime:
        patterns:
          - "symfony/*"
          - "doctrine/*"
          - "phpunit/phpunit"
          - "phpstan/*"
          - "friendsofphp/php-cs-fixer"
        update-types:
          - minor
          - patch

  - package-ecosystem: composer
    directory: /examples/showcase-demo
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - composer
      - showcase

  - package-ecosystem: composer
    directory: /examples/easyadmin-bridge-demo
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - composer
      - examples

  - package-ecosystem: composer
    directory: /examples/easyadmin-bridge-demo-v4
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - composer
      - examples

  - package-ecosystem: composer
    directory: /examples/messenger-demo
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - composer
      - examples

  - package-ecosystem: composer
    directory: /examples/filter-standalone-demo
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - composer
      - examples

  # ---------------------------------------------------------------
  # GitHub Actions — pin every action by SHA / version, watched for
  # CVE + version bumps.
  # ---------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci
