# Dependabot configuration.
#
# Two ecosystems: Composer (per-package + demos) and github-actions
# (CI pinning). Major-version bumps are filtered out everywhere —
# they routinely break the multi-version CI matrix and need a human
# decision against the roadmap. Minor + patch ship automatically;
# security advisories override the schedule and ship immediately.

version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, composer]
    commit-message: { prefix: chore, include: scope }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      php-runtime:
        patterns:
          - "symfony/*"
          - "doctrine/*"
          - "phpunit/phpunit"
          - "phpstan/*"
          - "friendsofphp/php-cs-fixer"
        update-types: [minor, patch]

  - package-ecosystem: composer
    directory: /examples/showcase-demo
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    labels: [dependencies, composer, showcase]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: composer
    directory: /examples/easyadmin-bridge-demo
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    labels: [dependencies, composer, examples]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: composer
    directory: /examples/easyadmin-bridge-demo-v4
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    labels: [dependencies, composer, examples]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: composer
    directory: /examples/messenger-demo
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    labels: [dependencies, composer, examples]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: composer
    directory: /examples/filter-standalone-demo
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    labels: [dependencies, composer, examples]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, github-actions]
    commit-message: { prefix: ci }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
