name: Split monorepo to per-package repos

# Re-runs the subtree split on every push to main and on every tag
# push, so each `polysource/<pkg>` mirror always has the same HEAD
# (and the same tag set) as the corresponding `packages/<pkg>/`
# subtree of the monorepo. Packagist's GitHub webhook on each
# mirror picks up the new tag and indexes the version.
#
# Authentication: a dedicated GitHub App (`polysource-split`) is
# installed on the org with `contents: write` + `metadata: read`
# scoped to exactly the 16 mirror repos. Each workflow run mints a
# short-lived (≤60 min) installation token via
# `actions/create-github-app-token`; no long-lived push credential
# is stored in the runner. The App's private key lives only as a
# repository secret on this monorepo and never touches a runner's
# disk.
#
# To rotate the App private key:
#   1. Generate a new private key on the App settings page and
#      download the .pem.
#   2. `gh secret set SPLIT_APP_PRIVATE_KEY --repo polysource/polysource < new.pem`
#   3. Delete the old private key from the App settings page.
#   4. `rm new.pem` locally.
#
# To add a new package mirror:
#   1. Create the empty `polysource/<pkg>` repo (see
#      `scripts/split-packages.sh ensure_repo`).
#   2. Add it to the App's installation: org Settings → GitHub Apps →
#      polysource-split → Configure → Repository access.
#   3. Append the package name to the matrix below.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Avoid stacking up split runs when several pushes land back-to-back.
concurrency:
  group: split-${{ github.ref }}
  cancel-in-progress: false

jobs:
  split:
    name: Split & push ${{ matrix.package }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - core
          - symfony-bundle
          - twig-theme
          - filter
          - easyadmin-filter-bridge
          - audit
          - widgets
          - search
          - workflow-bridge
          - bulk-async
          - adapter-messenger
          - adapter-doctrine
          - adapter-redis
          - adapter-flysystem
          - adapter-http
          - adapter-meilisearch
    steps:
      - uses: actions/checkout@v4
        with:
          # subtree split needs the full history
          fetch-depth: 0
          fetch-tags: true
          # Don't keep the runner's GITHUB_TOKEN in `.git/config` as
          # an http.extraheader — otherwise it overrides the App
          # installation token we embed in the push URL below, and
          # the push gets rejected with `denied to github-actions[bot]`.
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "polysource-split[bot]"
          git config user.email "polysource-split[bot]@users.noreply.github.com"

      - name: Mint installation token from polysource-split GitHub App
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SPLIT_APP_ID }}
          private-key: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
          owner: polysource
          repositories: ${{ matrix.package }}

      - name: Run subtree split for packages/${{ matrix.package }}
        id: split
        run: |
          SHA=$(git subtree split --prefix=packages/${{ matrix.package }} HEAD 2>/dev/null | tail -1)
          if [[ -z "$SHA" ]]; then
            echo "split produced no SHA — aborting" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Split SHA: $SHA"

      - name: Push split to polysource/${{ matrix.package }}
        env:
          REMOTE: https://x-access-token:${{ steps.app_token.outputs.token }}@github.com/polysource/${{ matrix.package }}.git
          SHA: ${{ steps.split.outputs.sha }}
        run: |
          # Push main first; this is force-only because the split
          # mirror tracks a regenerated history each run.
          git push --force "$REMOTE" "$SHA:refs/heads/main"

          # If the trigger is a tag push, mirror the tag onto the
          # split mirror at the corresponding split SHA. Lightweight
          # tags pushed at $SHA are enough for Packagist to pick the
          # version up.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            git push --force "$REMOTE" "$SHA:${{ github.ref }}"
          fi
