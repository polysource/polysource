name: Split monorepo to per-package repos

# Re-runs the subtree split on every push to main and on every tag
# push, so each `polysource/<pkg>` mirror always has the same HEAD
# (and the same tag set) as the corresponding `packages/<pkg>/`
# subtree of the monorepo. Packagist's GitHub webhook on each
# mirror picks up the new tag and indexes the version.
#
# One-time setup before this workflow can run:
#   1. Generate an SSH key pair: `ssh-keygen -t ed25519 -f /tmp/split -N ""`
#   2. For EACH of the 16 split repos (polysource/core, etc.):
#      Settings → Deploy keys → Add deploy key → paste /tmp/split.pub,
#      tick "Allow write access".
#   3. On polysource/polysource (this repo): Settings → Secrets and
#      variables → Actions → New repository secret → name
#      `SPLIT_PUSH_KEY`, value = contents of /tmp/split (private key).
#   4. Delete /tmp/split + /tmp/split.pub locally — the secret is
#      now stored on GitHub.
#
# Until that's configured, this workflow runs but fails on push;
# the v0.1.0 split mirrors were bootstrapped via
# `scripts/split-packages.sh` directly from the maintainer's
# machine using their personal SSH credential.

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# Avoid stacking up split runs when several pushes land back-to-back.
concurrency:
  group: split-${{ github.ref }}
  cancel-in-progress: false

jobs:
  split:
    name: Split & push ${{ matrix.package }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - core
          - symfony-bundle
          - twig-theme
          - filter
          - easyadmin-filter-bridge
          - audit
          - widgets
          - search
          - workflow-bridge
          - bulk-async
          - adapter-messenger
          - adapter-doctrine
          - adapter-redis
          - adapter-flysystem
          - adapter-http
          - adapter-meilisearch
    steps:
      - uses: actions/checkout@v4
        with:
          # subtree split needs the full history
          fetch-depth: 0
          fetch-tags: true

      - name: Configure git identity
        run: |
          git config user.name "polysource-bot"
          git config user.email "noreply@polysource.dev"

      - name: Set up SSH deploy key for the split mirror
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SPLIT_PUSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run subtree split for packages/${{ matrix.package }}
        id: split
        run: |
          SHA=$(git subtree split --prefix=packages/${{ matrix.package }} HEAD 2>/dev/null | tail -1)
          if [[ -z "$SHA" ]]; then
            echo "split produced no SHA — aborting" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Split SHA: $SHA"

      - name: Push split to polysource/${{ matrix.package }}
        env:
          REMOTE: git@github.com:polysource/${{ matrix.package }}.git
          SHA: ${{ steps.split.outputs.sha }}
        run: |
          # Push main first; this is force-only because the split
          # mirror tracks a regenerated history each run.
          git push --force "$REMOTE" "$SHA:refs/heads/main"

          # If the trigger is a tag push, mirror the tag onto the
          # split mirror at the corresponding split SHA. Annotated
          # tags would need a re-creation; lightweight tags pushed
          # at $SHA are enough for Packagist to pick the version up.
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            git push --force "$REMOTE" "$SHA:${{ github.ref }}"
          fi
