name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate composer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Validate sub-package composer.json
        run: |
          for pkg in packages/*/composer.json; do
            [ -f "$pkg" ] && composer validate --strict --no-check-publish --working-dir="$(dirname "$pkg")"
          done
        shell: bash

  cs:
    name: Code style (PHP-CS-Fixer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction --using-cache=no

  phpstan:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=github

  test:
    name: PHPUnit (PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / EasyAdmin ${{ matrix.easyadmin }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # ADR-015 amendement 2026-05-05: per-package matrix.
        #
        # `polysource/symfony-bundle` and `polysource/adapter-messenger`
        # use Sf 6.2+ APIs (`ValueResolverInterface`, renamed
        # `SecurityBundle\Security`) so they require `^6.4 || ^7.0 || ^8.0`.
        # `polysource/filter` and `polysource/easyadmin-filter-bridge`
        # advertise the wider `^5.4 || ^6.0 || ^7.0 || ^8.0` because
        # they don't use 6.2+ APIs — but the monorepo-wide test job below
        # tests the WHOLE suite (incl. symfony-bundle), so its floor is
        # Sf 6.4. Sf 5.4 compat for filter+bridge is composer-validated
        # (the bridge advertises `^5.4`) but not test-gated by this matrix.
        #
        # Each row is listed by hand; cartesian-product matrices generate
        # impossible combos (e.g. PHP 8.1 × Sf 7.4 — Sf 7 needs 8.2+).
        #   1. Legacy floor:   PHP 8.1 + Sf 6.4 LTS   + EA 4.x
        #   2. Mainstream:     PHP 8.2 + Sf 6.4 LTS   + EA 4.x
        #   3. Bridge xfer:    PHP 8.2 + Sf 6.4 LTS   + EA 5.x
        #   4. Non-LTS proof:  PHP 8.3 + Sf 7.2 (EOL) + EA 5.x
        #   5. Modern:         PHP 8.3 + Sf 7.4 LTS   + EA 5.x
        #   6. Bleeding:       PHP 8.4 + Sf 7.4 LTS   + EA 5.x (dev local)
        include:
          - php: '8.1'
            symfony: '6.4.*'
            easyadmin: '^4.24'
          - php: '8.2'
            symfony: '6.4.*'
            easyadmin: '^4.24'
          - php: '8.2'
            symfony: '6.4.*'
            easyadmin: '^5.0'
          - php: '8.3'
            symfony: '7.2.*'
            easyadmin: '^5.0'
          - php: '8.3'
            symfony: '7.4.*'
            easyadmin: '^5.0'
          - php: '8.4'
            symfony: '7.4.*'
            easyadmin: '^5.0'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, flex
          coverage: pcov

      - name: Constrain Symfony version
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-interaction symfony/flex
          composer config --no-plugins allow-plugins.symfony/flex true
          composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Pin EasyAdmin version
        run: |
          composer require --no-update --no-interaction \
            "easycorp/easyadmin-bundle:${{ matrix.easyadmin }}"

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox

  coverage:
    name: Core coverage gate (>= 90%)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Generate Clover report (core only)
        run: |
          mkdir -p var
          vendor/bin/phpunit --testsuite=unit \
            --coverage-clover=var/coverage-core.xml \
            --coverage-filter=packages/core/src

      - name: Enforce 90% coverage threshold on packages/core
        run: php scripts/coverage-gate.php var/coverage-core.xml 90

      - name: Upload Clover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: var/coverage-core.xml
          retention-days: 7

  e2e:
    name: E2E (Panther + showcase compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Boot showcase compose stack (postgres + redis + mercure + meilisearch + minio + wiremock + chrome)
        working-directory: examples/showcase-demo
        run: |
          # The PHP image's Dockerfile builds a non-root `app` user with
          # UID/GID baked from build args. The default 1000:1000 doesn't
          # match the GitHub runner UID — bind-mounted /repo writes fail
          # with EACCES (composer install, importmap:install, etc.).
          # Build the image with the host runner's actual UID/GID so
          # every write under the mount is owned correctly.
          export UID=$(id -u)
          export GID=$(id -g)
          docker compose --profile e2e build php
          docker compose --profile e2e up -d
          echo "▶ Waiting for services to become healthy..."
          for i in $(seq 1 60); do
            ready=$(docker compose ps --format json | jq -s '[.[] | select(.Health == "healthy" or (.Service == "chrome" and .State == "running") or (.Service == "php" and .State == "running") or (.Service == "nginx" and .State == "running") or (.Service == "mercure" and .State == "running"))] | length')
            total=$(docker compose ps --format json | jq -s 'length')
            echo "  ($i/60) $ready of $total services ready"
            [ "$ready" = "$total" ] && break
            sleep 2
          done
          docker compose ps

      - name: Allow root /repo for git inside the showcase container
        working-directory: examples/showcase-demo
        run: |
          # The container's /repo bind-mount is owned by the host runner UID.
          # Composer's plugin loader checks git's safe.directory to see whether
          # the dependency tree is "trusted"; without this exception, the
          # `composer install` step exits 1 on "fatal: detected dubious ownership".
          docker compose exec -T php sh -c "git config --global --add safe.directory '*'"

      - name: Install showcase composer deps inside php container
        working-directory: examples/showcase-demo
        run: |
          docker compose exec -T php sh -c 'composer install --no-interaction --no-progress'

      - name: Provision database + load fixtures
        working-directory: examples/showcase-demo
        run: |
          docker compose exec -T php sh -c '
            php bin/console doctrine:database:drop --if-exists --force --no-interaction
            php bin/console doctrine:database:create --no-interaction
            php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
            php bin/console messenger:setup-transports --no-interaction
            php -d memory_limit=2G bin/console doctrine:fixtures:load --no-interaction
            php -d memory_limit=2G bin/console app:seed-failed-messages
            php -d memory_limit=2G bin/console app:seed-stores
          '

      - name: Wait for Selenium grid
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4444/wd/hub/status | grep -q '"ready":true' && break
            echo "  waiting for Selenium ($i/30)…"
            sleep 2
          done

      - name: Run Panther test suite
        working-directory: examples/showcase-demo
        run: docker compose exec -T php sh -c 'php -d memory_limit=2G vendor/bin/phpunit --group=panther --testdox'

      - name: Run adapter integration tests against real containers
        working-directory: examples/showcase-demo
        # Defined per-adapter in packages/adapter-*/tests/Functional/RealContainer*.
        # Conditionally executed when the dedicated --group filter matches.
        run: |
          docker compose exec -T \
            -e POLYSOURCE_REAL_REDIS=redis://redis:6379 \
            -e POLYSOURCE_REAL_MEILISEARCH=http://meilisearch:7700 \
            -e POLYSOURCE_REAL_MEILISEARCH_KEY=showcase-meili-master-key \
            -e POLYSOURCE_REAL_S3_ENDPOINT=http://minio:9000 \
            -e POLYSOURCE_REAL_S3_BUCKET=shopco \
            -e POLYSOURCE_REAL_S3_ACCESS_KEY=shopcoadmin \
            -e POLYSOURCE_REAL_S3_SECRET_KEY=shopcoadmin-secret \
            -e POLYSOURCE_REAL_HTTP=http://wiremock:8080 \
            php sh -c '
              cd /repo && vendor/bin/phpunit --group=real-container --testdox || exit_code=$?
              # If no tests match the group, phpunit exits 2 — accept it as "no real-container tests yet".
              [ "${exit_code:-0}" = "2" ] && exit 0
              exit ${exit_code:-0}
            '

      - name: Capture container logs on failure
        if: failure()
        working-directory: examples/showcase-demo
        run: |
          docker compose logs --no-color > /tmp/compose-logs.txt 2>&1 || true
          docker compose ps > /tmp/compose-ps.txt 2>&1 || true

      - name: Upload diagnostic artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-diagnostics
          path: |
            /tmp/compose-logs.txt
            /tmp/compose-ps.txt
            examples/showcase-demo/var/log/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down compose stack
        if: always()
        working-directory: examples/showcase-demo
        run: docker compose --profile e2e down --volumes --remove-orphans
