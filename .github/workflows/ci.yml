name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate composer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Validate sub-package composer.json
        run: |
          for pkg in packages/*/composer.json; do
            [ -f "$pkg" ] && composer validate --strict --no-check-publish --working-dir="$(dirname "$pkg")"
          done
        shell: bash

  cs:
    name: Code style (PHP-CS-Fixer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction --using-cache=no

  phpstan:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=github

  test:
    name: PHPUnit (PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / EasyAdmin ${{ matrix.easyadmin }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # ADR-015 (multi-version baseline): 5 explicit combos hit the
        # realistic profiles of EA-using Symfony apps in 2026.
        # Cartesian-product matrices generate impossible combos
        # (e.g. PHP 8.1 × Symfony 7.4) so we list each row by hand.
        #   1. Legacy stack: PHP 8.1 + Sf 5.4 LTS + EA 4.x
        #   2. Mainstream:   PHP 8.2 + Sf 6.4 LTS + EA 4.x
        #   3. Bridge xfer:  PHP 8.2 + Sf 6.4 LTS + EA 5.x
        #   4. Modern:       PHP 8.3 + Sf 7.4 LTS + EA 5.x
        #   5. Bleeding:     PHP 8.4 + Sf 7.4 LTS + EA 5.x (dev local)
        include:
          - php: '8.1'
            symfony: '5.4.*'
            easyadmin: '^4.24'
          - php: '8.2'
            symfony: '6.4.*'
            easyadmin: '^4.24'
          - php: '8.2'
            symfony: '6.4.*'
            easyadmin: '^5.0'
          - php: '8.3'
            symfony: '7.4.*'
            easyadmin: '^5.0'
          - php: '8.4'
            symfony: '7.4.*'
            easyadmin: '^5.0'
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, flex
          coverage: pcov

      - name: Constrain Symfony version
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-interaction symfony/flex
          composer config --no-plugins allow-plugins.symfony/flex true
          composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Pin EasyAdmin version
        run: |
          composer require --no-update --no-interaction \
            "easycorp/easyadmin-bundle:${{ matrix.easyadmin }}"

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPUnit
        run: vendor/bin/phpunit --testdox

  coverage:
    name: Core coverage gate (>= 90%)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Generate Clover report (core only)
        run: |
          mkdir -p var
          vendor/bin/phpunit --testsuite=unit \
            --coverage-clover=var/coverage-core.xml \
            --coverage-filter=packages/core/src

      - name: Enforce 90% coverage threshold on packages/core
        run: php scripts/coverage-gate.php var/coverage-core.xml 90

      - name: Upload Clover report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: var/coverage-core.xml
          retention-days: 7
