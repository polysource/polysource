name: CI

on:
  push:
    branches: [main]
    # Skip CI when a push only touches docs / launch-drafts /
    # markdown / screenshots — those changes don't affect runtime
    # behaviour and the maintainer runs `make ci` locally as the
    # last guardrail. Saves ~20 GH-Action-minutes per docs commit
    # (we burn one full matrix run otherwise).
    #
    # GitHub semantics: a push is skipped only when EVERY changed
    # path matches `paths-ignore`. Mixed code+docs commits still
    # trigger CI.
    paths-ignore:
      - 'docs/**'
      - '.launch-drafts/**'
      - '**/*.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '.launch-drafts/**'
      - '**/*.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Reusable step. The monorepo's path-resolved sub-packages take
  # their version from the current branch via Composer's
  # `extra.branch-alias` map, which is keyed on `dev-main`. PRs
  # opened on any other branch (typically `dependabot/...`) end up
  # advertising themselves as `dev-<branch-name>` and the root
  # constraint `polysource/*: 0.1.x-dev` no longer matches — every
  # CI job then fails at composer install.
  #
  # The workaround: before the install step, patch each
  # sub-package's `extra.branch-alias` to additionally map the
  # current branch to `0.1.x-dev`. Touches working-tree files only
  # (never committed back). No-op on `main`.
  validate:
    name: Validate composer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Validate sub-package composer.json
        run: |
          for pkg in packages/*/composer.json; do
            [ -f "$pkg" ] && composer validate --strict --no-check-publish --working-dir="$(dirname "$pkg")"
          done
        shell: bash

      - name: Docs truth-sync gate
        # Catches doc drift against the code: version constant vs tag,
        # branch-alias lineages, stale pre-1.0 status language, ADR /
        # package / screenshot counts. Cf. scripts/docs-truth-check.sh.
        run: |
          git fetch --tags --force --quiet || true
          ./scripts/docs-truth-check.sh
        shell: bash

  cs:
    name: Code style (PHP-CS-Fixer)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Patch branch-alias for non-main PR branches
        # Composer's path repos derive the package version from git
        # state. The root constraint `polysource/*: 0.1.x-dev` is
        # satisfied by the `dev-main -> 0.1.x-dev` alias each
        # sub-package declares. On `pull_request` events,
        # `actions/checkout` checks out a detached HEAD on the
        # PR's merge ref, so composer computes `dev-<commit-sha>`
        # — which the alias map doesn't cover. We add aliases for
        # BOTH the branch name and the current commit SHA so
        # whichever heuristic composer picks resolves cleanly.
        # Touches working-tree files only; never committed back.
        if: github.event_name == 'pull_request' && github.head_ref != 'main'
        shell: bash
        run: |
          BRANCH="${{ github.head_ref }}"
          SAFE="${BRANCH//[^a-zA-Z0-9_-]/-}"
          SHA=$(git rev-parse HEAD)
          for f in packages/*/composer.json; do
            tmp=$(mktemp)
            jq --arg branch "dev-$SAFE" --arg sha "dev-$SHA" \
              '.extra["branch-alias"][$branch] = "0.1.x-dev"
             | .extra["branch-alias"][$sha] = "0.1.x-dev"' "$f" > "$tmp"
            mv "$tmp" "$f"
          done

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHP-CS-Fixer (dry-run)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction --using-cache=no

  phpstan:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2, flex
          coverage: none

      - name: Constrain Symfony version
        # PHPStan parses vendor code at the ADR-015 baseline
        # (phpVersion 8.1). Symfony 8.1+ ships PHP 8.4-only syntax
        # (property hooks, asymmetric visibility) that the 8.1 parser
        # rejects, so an unpinned install breaks analysis the day a
        # new Symfony minor lands. Pin the vendor to the same LTS the
        # test matrix validates.
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-interaction symfony/flex
          composer config --no-plugins allow-plugins.symfony/flex true
          composer config extra.symfony.require "7.4.*"

      - name: Patch branch-alias for non-main PR branches
        # Composer's path repos derive the package version from git
        # state. The root constraint `polysource/*: 0.1.x-dev` is
        # satisfied by the `dev-main -> 0.1.x-dev` alias each
        # sub-package declares. On `pull_request` events,
        # `actions/checkout` checks out a detached HEAD on the
        # PR's merge ref, so composer computes `dev-<commit-sha>`
        # — which the alias map doesn't cover. We add aliases for
        # BOTH the branch name and the current commit SHA so
        # whichever heuristic composer picks resolves cleanly.
        # Touches working-tree files only; never committed back.
        if: github.event_name == 'pull_request' && github.head_ref != 'main'
        shell: bash
        run: |
          BRANCH="${{ github.head_ref }}"
          SAFE="${BRANCH//[^a-zA-Z0-9_-]/-}"
          SHA=$(git rev-parse HEAD)
          for f in packages/*/composer.json; do
            tmp=$(mktemp)
            jq --arg branch "dev-$SAFE" --arg sha "dev-$SHA" \
              '.extra["branch-alias"][$branch] = "0.1.x-dev"
             | .extra["branch-alias"][$sha] = "0.1.x-dev"' "$f" > "$tmp"
            mv "$tmp" "$f"
          done

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress --error-format=github

  test:
    name: PHPUnit (PHP ${{ matrix.php }} / Symfony ${{ matrix.symfony }} / EasyAdmin ${{ matrix.easyadmin }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # ADR-015 amendement 2026-08-06 (v1.0 floors): PHP 8.2+ /
        # Symfony 6.4 LTS+ across every package — the pre-1.0
        # per-package split (filter+bridge advertising ^5.4) ended
        # with the v1.0 freeze, cf. ADR-011 floor targets.
        #
        # Each row is listed by hand; cartesian-product matrices generate
        # impossible combos (e.g. PHP 8.2 × Sf 8.0 — Sf 8 needs 8.4+).
        #   1. Floor:          PHP 8.2 + Sf 6.4 LTS   + EA 4.x
        #   2. Bridge xfer:    PHP 8.2 + Sf 6.4 LTS   + EA 5.x
        #   3. Non-LTS proof:  PHP 8.3 + Sf 7.2 (EOL) + EA 5.x
        #   4. Modern:         PHP 8.3 + Sf 7.4 LTS   + EA 5.x
        #   5. Bleeding:       PHP 8.4 + Sf 7.4 LTS   + EA 5.x (dev local)
        include:
          - php: '8.2'
            symfony: '6.4.*'
            easyadmin: '^4.24'
          - php: '8.2'
            symfony: '6.4.*'
            easyadmin: '^5.0'
          - php: '8.3'
            symfony: '7.2.*'
            easyadmin: '^5.0'
          - php: '8.3'
            symfony: '7.4.*'
            easyadmin: '^5.0'
          - php: '8.4'
            symfony: '7.4.*'
            easyadmin: '^5.0'
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, flex
          coverage: pcov

      - name: Constrain Symfony version
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-interaction symfony/flex
          composer config --no-plugins allow-plugins.symfony/flex true
          composer config extra.symfony.require "${{ matrix.symfony }}"

      - name: Pin EasyAdmin version
        run: |
          composer require --no-update --no-interaction \
            "easycorp/easyadmin-bundle:${{ matrix.easyadmin }}"

      - name: Patch branch-alias for non-main PR branches
        # Composer's path repos derive the package version from git
        # state. The root constraint `polysource/*: 0.1.x-dev` is
        # satisfied by the `dev-main -> 0.1.x-dev` alias each
        # sub-package declares. On `pull_request` events,
        # `actions/checkout` checks out a detached HEAD on the
        # PR's merge ref, so composer computes `dev-<commit-sha>`
        # — which the alias map doesn't cover. We add aliases for
        # BOTH the branch name and the current commit SHA so
        # whichever heuristic composer picks resolves cleanly.
        # Touches working-tree files only; never committed back.
        if: github.event_name == 'pull_request' && github.head_ref != 'main'
        shell: bash
        run: |
          BRANCH="${{ github.head_ref }}"
          SAFE="${BRANCH//[^a-zA-Z0-9_-]/-}"
          SHA=$(git rev-parse HEAD)
          for f in packages/*/composer.json; do
            tmp=$(mktemp)
            jq --arg branch "dev-$SAFE" --arg sha "dev-$SHA" \
              '.extra["branch-alias"][$branch] = "0.1.x-dev"
             | .extra["branch-alias"][$sha] = "0.1.x-dev"' "$f" > "$tmp"
            mv "$tmp" "$f"
          done

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run PHPUnit (unit + functional suites)
        # The `integration` suite has its own job below because
        # Symfony's `Kernel::handle()` pushes an exception handler
        # that `Kernel::shutdown()` doesn't unwind — PHPUnit 11's
        # global `failOnRisky` mode then flags every test. The
        # integration suite is run with `--do-not-fail-on-risky`.
        run: vendor/bin/phpunit --testsuite=unit,functional --testdox

  sf54-floor:
    name: Sf 6.4 floor smoke (filter + bridge alone)
    runs-on: ubuntu-24.04
    # Dedicated floor gate: installs ONLY filter +
    # easyadmin-filter-bridge from Packagist on a vanilla skeleton at
    # the documented v1.0 floor (Sf 6.4 LTS + EA 4) — proves the
    # bridge-alone install path at the floor independently of the
    # full-suite matrix.
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          # PHP 8.2 — the v1.0 floor. Gated against EA 4 (the
          # realistic combination of an app that hasn't bumped its
          # admin in years).
          php-version: '8.2'
          tools: composer:v2

      - name: Bootstrap vanilla Symfony 6.4 skeleton + EA 4
        run: |
          mkdir -p /tmp/sf54-smoke
          cd /tmp/sf54-smoke
          composer create-project symfony/skeleton:^6.4 . --no-interaction --no-progress 2>&1 | tail -3
          composer require --no-interaction --no-progress \
            easycorp/easyadmin-bundle:^4.24 \
            polysource/easyadmin-filter-bridge:^0.6 \
            doctrine/orm doctrine/doctrine-bundle \
            symfony/security-bundle 2>&1 | tail -8

      - name: Assert bridge + filter resolved + no symfony-bundle
        run: |
          cd /tmp/sf54-smoke
          # symfony-bundle requires Sf 6.4+ — MUST not be installed transitively.
          if [ -d vendor/polysource/symfony-bundle ]; then
              echo 'FAIL: polysource/symfony-bundle must not be pulled by a bridge-alone install.'
              exit 1
          fi
          # filter + bridge MUST be installed.
          for pkg in core filter easyadmin-filter-bridge; do
              [ -d "vendor/polysource/$pkg" ] || { echo "FAIL: polysource/$pkg missing"; exit 1; }
          done
          echo 'OK: polysource/{core,filter,easyadmin-filter-bridge} at the Sf 6.4 + EA 4 floor'

      - name: Cache clear succeeds (bundles auto-register cleanly)
        run: |
          cd /tmp/sf54-smoke
          php bin/console cache:clear --env=dev 2>&1 | tail -3

  integration:
    name: Bridge integration (TestKernel + SQLite)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2, flex

      - name: Constrain Symfony version
        # Unpinned installs drifted to Symfony 8.1, which is outside
        # the validated matrix and turns the known handler leak into
        # hard test errors. Pin to the LTS the matrix validates.
        run: |
          composer global config --no-plugins allow-plugins.symfony/flex true
          composer global require --no-interaction symfony/flex
          composer config --no-plugins allow-plugins.symfony/flex true
          composer config extra.symfony.require "7.4.*"

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Run integration suite (failOnRisky disabled — Symfony handler leak)
        run: vendor/bin/phpunit --testsuite=integration --do-not-fail-on-risky --testdox

  coverage:
    name: Core coverage gate (>= 90%)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: pcov

      - name: Patch branch-alias for non-main PR branches
        # Composer's path repos derive the package version from git
        # state. The root constraint `polysource/*: 0.1.x-dev` is
        # satisfied by the `dev-main -> 0.1.x-dev` alias each
        # sub-package declares. On `pull_request` events,
        # `actions/checkout` checks out a detached HEAD on the
        # PR's merge ref, so composer computes `dev-<commit-sha>`
        # — which the alias map doesn't cover. We add aliases for
        # BOTH the branch name and the current commit SHA so
        # whichever heuristic composer picks resolves cleanly.
        # Touches working-tree files only; never committed back.
        if: github.event_name == 'pull_request' && github.head_ref != 'main'
        shell: bash
        run: |
          BRANCH="${{ github.head_ref }}"
          SAFE="${BRANCH//[^a-zA-Z0-9_-]/-}"
          SHA=$(git rev-parse HEAD)
          for f in packages/*/composer.json; do
            tmp=$(mktemp)
            jq --arg branch "dev-$SAFE" --arg sha "dev-$SHA" \
              '.extra["branch-alias"][$branch] = "0.1.x-dev"
             | .extra["branch-alias"][$sha] = "0.1.x-dev"' "$f" > "$tmp"
            mv "$tmp" "$f"
          done

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Generate Clover report (core only)
        run: |
          mkdir -p var
          vendor/bin/phpunit --testsuite=unit \
            --coverage-clover=var/coverage-core.xml \
            --coverage-filter=packages/core/src

      - name: Enforce 90% coverage threshold on packages/core
        run: php scripts/coverage-gate.php var/coverage-core.xml 90

      - name: Upload Clover report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-core
          path: var/coverage-core.xml
          retention-days: 7

  e2e:
    name: E2E (Panther + showcase compose)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Boot showcase compose stack (postgres + redis + mercure + meilisearch + minio + wiremock + chrome)
        working-directory: examples/showcase-demo
        run: |
          # The PHP image's Dockerfile builds a non-root `app` user with
          # UID/GID baked from build args. The default 1000:1000 doesn't
          # match the GitHub runner UID — bind-mounted /repo writes fail
          # with EACCES (composer install, importmap:install, etc.).
          # Build the image with the host runner's actual UID/GID so
          # every write under the mount is owned correctly.
          #
          # bash treats `UID` as readonly; pass via --build-arg directly
          # rather than `export UID=…`.
          docker compose --profile e2e build --build-arg UID="$(id -u)" --build-arg GID="$(id -g)" php
          docker compose --profile e2e up -d
          echo "▶ Waiting for services to become healthy..."
          for i in $(seq 1 60); do
            ready=$(docker compose ps --format json | jq -s '[.[] | select(.Health == "healthy" or (.Service == "chrome" and .State == "running") or (.Service == "php" and .State == "running") or (.Service == "nginx" and .State == "running") or (.Service == "mercure" and .State == "running"))] | length')
            total=$(docker compose ps --format json | jq -s 'length')
            echo "  ($i/60) $ready of $total services ready"
            [ "$ready" = "$total" ] && break
            sleep 2
          done
          docker compose ps

      - name: Allow root /repo for git inside the showcase container
        working-directory: examples/showcase-demo
        run: |
          # The container's /repo bind-mount is owned by the host runner UID.
          # Composer's plugin loader checks git's safe.directory to see whether
          # the dependency tree is "trusted"; without this exception, the
          # `composer install` step exits 1 on "fatal: detected dubious ownership".
          docker compose exec -T php sh -c "git config --global --add safe.directory '*'"

      - name: Install showcase composer deps inside php container
        working-directory: examples/showcase-demo
        run: |
          docker compose exec -T php sh -c 'composer install --no-interaction --no-progress'

      - name: Provision database + load fixtures
        working-directory: examples/showcase-demo
        run: |
          docker compose exec -T php sh -c '
            php bin/console doctrine:database:drop --if-exists --force --no-interaction
            php bin/console doctrine:database:create --no-interaction
            php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
            php bin/console messenger:setup-transports --no-interaction
            php -d memory_limit=2G bin/console doctrine:fixtures:load --no-interaction
            php -d memory_limit=2G bin/console app:seed-failed-messages
            php -d memory_limit=2G bin/console app:seed-stores
          '

      - name: Wait for Selenium grid
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4444/wd/hub/status | grep -q '"ready":true' && break
            echo "  waiting for Selenium ($i/30)…"
            sleep 2
          done

      - name: Run Panther test suite
        working-directory: examples/showcase-demo
        # The default phpunit.dist.xml is strict (failOnDeprecation +
        # failOnWarning) so the package matrix catches drift fast.
        # Symfony Panther 2.x on Sf 7 emits ~10 unrelated framework
        # deprecations every Panther run plus 1 "abstract class"
        # PHPUnit runner warning for AbstractShowcasePantherTest.
        # Use the dedicated `phpunit.panther-ci.xml` config that keeps
        # the same testsuite but drops the fail-on-* attributes.
        run: docker compose exec -T php sh -c 'php -d memory_limit=2G vendor/bin/phpunit -c phpunit.panther-ci.xml --group=panther --testdox'

      - name: Install root composer deps inside the container
        working-directory: examples/showcase-demo
        # The real-container adapter tests live in packages/adapter-*/
        # and run via the ROOT composer's phpunit + autoload, NOT the
        # showcase's. Same container, different vendor tree.
        run: |
          docker compose exec -T php sh -c 'cd /repo && composer install --no-interaction --no-progress'

      - name: Run adapter integration tests against real containers
        working-directory: examples/showcase-demo
        # Defined per-adapter in packages/adapter-*/tests/Functional/RealContainer*.
        # Conditionally executed when the dedicated --group filter matches.
        run: |
          docker compose exec -T \
            -e POLYSOURCE_REAL_REDIS=redis://redis:6379 \
            -e POLYSOURCE_REAL_MEILISEARCH=http://meilisearch:7700 \
            -e POLYSOURCE_REAL_MEILISEARCH_KEY=showcase-meili-master-key \
            -e POLYSOURCE_REAL_S3_ENDPOINT=http://minio:9000 \
            -e POLYSOURCE_REAL_S3_BUCKET=shopco \
            -e POLYSOURCE_REAL_S3_ACCESS_KEY=shopcoadmin \
            -e POLYSOURCE_REAL_S3_SECRET_KEY=shopcoadmin-secret \
            -e POLYSOURCE_REAL_HTTP=http://wiremock:8080 \
            php sh -c '
              cd /repo && vendor/bin/phpunit --group=real-container --testdox || exit_code=$?
              # If no tests match the group, phpunit exits 2 — accept it as "no real-container tests yet".
              [ "${exit_code:-0}" = "2" ] && exit 0
              exit ${exit_code:-0}
            '

      - name: Capture container logs on failure
        if: failure()
        working-directory: examples/showcase-demo
        run: |
          docker compose logs --no-color > /tmp/compose-logs.txt 2>&1 || true
          docker compose ps > /tmp/compose-ps.txt 2>&1 || true

      - name: Upload diagnostic artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-diagnostics
          path: |
            /tmp/compose-logs.txt
            /tmp/compose-ps.txt
            examples/showcase-demo/var/log/
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down compose stack
        if: always()
        working-directory: examples/showcase-demo
        run: docker compose --profile e2e down --volumes --remove-orphans
