        error: 'Échec du chargement du détail.'
        retry: 'Réessayer'
        back: 'Retour au listing'

    # UI des filtres — templates _filters_form + _filter_chips de twig-theme.
    filter:
        button_label: 'Filtres'
        active_label: 'Actifs :'
        clear: 'Effacer'
        clear_all: 'Tout effacer'
        apply: 'Appliquer'
        modal_title: 'Filtres'
        chip:
            remove: 'Retirer ce filtre'

    # Pagination — paginator.html.twig de twig-theme.
    pagination:
        label: 'Pagination'
        cursor_label: 'Pagination par curseur'
        previous: 'Précédent'
        next: 'Suivant'
        # Récapitulatif page : %count% lignes, page %current% / %last%.
        summary: '%count% enregistrements — page %current% / %last%'

    # Rendu du champ booléen — field/boolean.html.twig de twig-theme.
    field:
        boolean:
            yes: 'Oui'
            no: 'Non'
