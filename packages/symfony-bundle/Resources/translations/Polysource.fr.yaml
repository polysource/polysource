polysource:
    # Habillage des pages — utilisé dans les templates index, detail, layout
    # de twig-theme.
    chrome:
        detail: 'Détail'
        no_records: 'Aucun enregistrement.'
        no_fields_configured: 'Aucun champ configuré pour cette vue.'
        close: 'Fermer'

    # Row details extensibles (v1.1.0) — chevron de l'index + états du panneau.
    row_detail:
        title: "Détail de l'enregistrement"
        expand: 'Voir le détail'
        collapse: 'Masquer le détail'
