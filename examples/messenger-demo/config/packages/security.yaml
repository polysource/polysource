security:
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: 'plaintext'

    providers:
        in_memory:
            memory:
                users:
                    admin:
                        password: 'admin'
                        roles: ['ROLE_ADMIN']

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: in_memory
            http_basic:
                realm: 'Polysource demo (admin / admin)'

    # Polysource permission attributes (POLYSOURCE_*) don't start with
    # `ROLE_`, so Symfony's default RoleHierarchyVoter abstains on
    # them — a `role_hierarchy: { ROLE_ADMIN: [POLYSOURCE_*] }` mapping
    # is silently ineffective. We register a dedicated
    # `PolysourceAdminVoter` (autowired via `security.voter`) that
    # maps ROLE_ADMIN to every POLYSOURCE_* attribute. Real apps
    # would replace it with a domain voter that decides per attribute.

    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
