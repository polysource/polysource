# Polysource Showcase Demo — 8-service stack.
#
# Hero of the v0.1.0 launch (cf. ADR-025). Boots a complete ShopCo
# SaaS environment exercising the 15 packages.
#
# Services:
#   - php          (FPM 8.4 + extensions)
#   - nginx        (HTTP front + Mercure proxy)  → :8084
#   - postgres     (17, primary DB)              → :5435
#   - redis        (7, cache + adapter-redis)    → :6382
#   - meilisearch  (1.x, adapter-meilisearch)    → :7702
#   - minio        (S3-compat, adapter-flysystem) → :9100/9101
#   - mercure      (live progress for bulk-async) → behind nginx
#   - mailpit      (SMTP capture)                 → :8025 (UI), :1025 (SMTP)
#   - wiremock     (microservices for adapter-http) → :8089
#
# Run from the repo root: `make showcase`.

name: polysource-showcase-demo

services:
    php:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        image: polysource-showcase:php8.4
        volumes:
            - ../..:/repo:cached
            - composer-cache:/home/app/.composer
        environment:
            COMPOSER_MEMORY_LIMIT: -1
            APP_ENV: ${APP_ENV:-dev}
            APP_DEBUG: ${APP_DEBUG:-1}
        depends_on:
            postgres: { condition: service_healthy }
            redis: { condition: service_healthy }
            meilisearch: { condition: service_healthy }
            minio: { condition: service_healthy }
            mailpit: { condition: service_started }
            mercure: { condition: service_started }
            wiremock: { condition: service_started }

    nginx:
        image: nginx:1.27-alpine
        volumes:
            - ../..:/repo:cached
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - '8084:80'
        depends_on:
            - php

    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: shopco
            POSTGRES_USER: shopco
            POSTGRES_PASSWORD: shopco
        volumes:
            - postgres-data:/var/lib/postgresql/data
        ports:
            - '5435:5432'
        healthcheck:
            test: ['CMD', 'pg_isready', '-U', 'shopco']
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - '6382:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 10

    meilisearch:
        image: getmeili/meilisearch:v1.10
        environment:
            MEILI_MASTER_KEY: showcase-meili-master-key
            MEILI_ENV: development
            MEILI_NO_ANALYTICS: 'true'
        volumes:
            - meilisearch-data:/meili_data
        ports:
            - '7702:7700'
        healthcheck:
            test: ['CMD-SHELL', 'wget -qO- http://0.0.0.0:7700/health || exit 1']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    minio:
        image: minio/minio:latest
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: shopcoadmin
            MINIO_ROOT_PASSWORD: shopcoadmin-secret
        volumes:
            - minio-data:/data
        ports:
            - '9100:9000'
            - '9101:9001'
        healthcheck:
            test: ['CMD-SHELL', 'mc ready local 2>/dev/null || curl -fsS http://0.0.0.0:9000/minio/health/live || exit 1']
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 10s

    minio-init:
        image: minio/mc:latest
        depends_on:
            minio: { condition: service_healthy }
        entrypoint: >
            /bin/sh -c "
            mc alias set shopco http://minio:9000 shopcoadmin shopcoadmin-secret;
            mc mb -p shopco/shopco || true;
            mc anonymous set download shopco/shopco || true;
            "
        restart: 'no'

    mercure:
        image: dunglas/mercure:v0.16
        environment:
            SERVER_NAME: ':80'
            MERCURE_PUBLISHER_JWT_KEY: showcase-mercure-jwt-secret-32-chars-min-needed-here
            MERCURE_SUBSCRIBER_JWT_KEY: showcase-mercure-jwt-secret-32-chars-min-needed-here
            MERCURE_EXTRA_DIRECTIVES: |
                cors_origins http://localhost:8084
                anonymous

    mailpit:
        image: axllent/mailpit:latest
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
            - '8025:8025'
            - '1025:1025'

    wiremock:
        image: wiremock/wiremock:3.10.0
        command: ['--port', '8080', '--global-response-templating', '--verbose']
        volumes:
            - ./docker/wiremock:/home/wiremock:ro
        ports:
            - '8089:8080'

# Symfony Flex injected `database` (doctrine-bundle) and a duplicate
# `mercure` block (mercure-bundle) on first install. The showcase already
# defines those services above (postgres + mercure with the showcase-grade
# config), so the recipes are intentionally elided. If you re-run a recipe
# update, drop the duplicate ###> blocks before committing.

volumes:
    composer-cache: {}
    postgres-data: {}
    meilisearch-data: {}
    minio-data: {}
