parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
            # The Shopco* resource subclasses are NOT autodiscovered —
            # they get registered explicitly below as overrides for the
            # bundle's service IDs. Without this exclude the subclass
            # would be tagged polysource.resource (via #[AsResource]
            # inheritance) AND the bundle would also register the
            # parent → duplicate slug error at boot.
            - '../src/Polysource/Resource/Shopco*'

    # -------------------------------------------------------------------
    # Phase E — service factories for the 4 non-Doctrine adapters.
    # -------------------------------------------------------------------

    # Redis (Predis client + adapter-redis hash client wrapper).
    Predis\Client:
        arguments:
            $parameters: '%env(REDIS_URL)%'

    Predis\ClientInterface:
        alias: Predis\Client

    Polysource\Adapter\Redis\Client\RedisHashClientInterface:
        class: Polysource\Adapter\Redis\Client\PredisRedisHashClient
        arguments: ['@Predis\Client']

    # Meilisearch — host client + the single ShopCo products index.
    Meilisearch\Client:
        arguments:
            $url: '%env(MEILISEARCH_URL)%'
            $apiKey: '%env(MEILISEARCH_API_KEY)%'

    app.meilisearch.products_index:
        class: Meilisearch\Endpoints\Indexes
        factory: ['@Meilisearch\Client', 'index']
        arguments: ['shopco-products']

    Polysource\Adapter\Meilisearch\Client\MeilisearchIndexInterface:
        class: Polysource\Adapter\Meilisearch\Client\MeilisearchPhpIndexClient
        arguments: ['@app.meilisearch.products_index']

    # Flysystem on MinIO via AsyncAws (state-of-the-art S3 client 2026).
    AsyncAws\SimpleS3\SimpleS3Client:
        arguments:
            $configuration:
                endpoint: '%env(S3_ENDPOINT)%'
                accessKeyId: '%env(S3_ACCESS_KEY)%'
                accessKeySecret: '%env(S3_SECRET_KEY)%'
                region: '%env(S3_REGION)%'
                pathStyleEndpoint: true

    League\Flysystem\AsyncAwsS3\AsyncAwsS3Adapter:
        arguments:
            $client: '@AsyncAws\SimpleS3\SimpleS3Client'
            $bucket: '%env(S3_BUCKET)%'

    League\Flysystem\Filesystem:
        arguments:
            $adapter: '@League\Flysystem\AsyncAwsS3\AsyncAwsS3Adapter'

    League\Flysystem\FilesystemOperator:
        alias: League\Flysystem\Filesystem

    # HTTP client scoped to WireMock root — the trailing slash matters:
    # the HttpDataSource passes paths starting with `/admin/...` and
    # Symfony's scoped client treats absolute paths as relative to the
    # SCHEME+HOST of the base URI (path-component dropped). Trailing
    # slash keeps the base host parsed correctly.
    app.http_client.microservices:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['Symfony\Component\HttpClient\HttpClient', 'createForBaseUri']
        arguments:
            $baseUri: '%env(PAYMENT_SERVICE_URL)%/'

    # -------------------------------------------------------------------
    # Phase F — Polysource widgets dashboard. Factory service tagged
    # `polysource.widgets.dashboard` so DashboardRegistry picks it up.
    # The provider builds the Dashboard from live DB state.
    # -------------------------------------------------------------------
    app.dashboard.home:
        class: Polysource\Widgets\Dashboard\Dashboard
        factory: ['@App\Polysource\Widget\ShopcoDashboardProvider', '__invoke']
        tags: ['polysource.widgets.dashboard']

    # Phase I — screenshots command needs the project_dir scalar.
    App\Command\ShowcaseScreenshotsCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # -------------------------------------------------------------------
    # Polysource resource overrides — replace the bundle's service class
    # with our subclass so configureFields() returns real columns. The
    # bundle's tag (`polysource.resource`) stays attached to the same
    # service ID, so the route loader still mounts the resource.
    # Required until polysource/core v0.2 ships concrete field types
    # (cf. ADR-011). The Shopco* subclasses are excluded from the
    # App\ autodiscovery scan above so they don't get double-tagged.
    # -------------------------------------------------------------------
    # The bundle's services.php registers each parent resource with its
    # tagged_iterator($actions). When we override `class:` here, Symfony's
    # autowire fills only the typed args (DataSource) and falls back to
    # the constructor default `[]` for the `iterable $actions` because
    # iterables can't be auto-resolved. Result: the override loses every
    # bundled action (e.g. ExportAuditCsvAction on audit-log,
    # CancelBulkJobAction on bulk-jobs, retry/dismiss/purge on
    # failed-messages). We re-pass the tagged_iterator explicitly.
    Polysource\Adapter\Messenger\Resource\FailedMessageResource:
        class: App\Polysource\Resource\ShopcoFailedMessageResource
        arguments:
            $actions: !tagged_iterator polysource.messenger.action

    Polysource\Audit\Resource\AuditLogResource:
        class: App\Polysource\Resource\ShopcoAuditLogResource
        arguments:
            $actions: !tagged_iterator polysource.audit.action

    Polysource\BulkAsync\Resource\BulkJobResource:
        class: App\Polysource\Resource\ShopcoBulkJobResource
        arguments:
            $actions: !tagged_iterator polysource.bulk_async.action
