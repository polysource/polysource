server {
    listen 80;
    server_name _;
    root /repo/examples/showcase-demo/public;
    index index.php;

    client_max_body_size 16m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    # Mercure proxy — the Stimulus EventSource hits the public URL.
    location /.well-known/mercure {
        proxy_pass http://mercure:80/.well-known/mercure;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 24h;
    }

    # Block direct .php access except index.php (Symfony front controller).
    location ~ \.php$ {
        return 404;
    }
}
