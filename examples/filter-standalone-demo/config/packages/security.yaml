security:
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: 'plaintext'

    providers:
        in_memory:
            memory:
                users:
                    alice:
                        password: 'alice'
                        roles: ['ROLE_USER']
                    bob:
                        password: 'bob'
                        roles: ['ROLE_USER']

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: in_memory
            http_basic:
                realm: 'Polysource standalone filter demo (alice / alice)'
