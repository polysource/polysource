security:
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: 'plaintext'

    providers:
        in_memory:
            memory:
                users:
                    alice:
                        password: 'alice'
                        roles: ['ROLE_USER']
                    bob:
                        password: 'bob'
                        roles: ['ROLE_USER']

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: in_memory
            form_login:
                login_path: login
                check_path: login
                default_target_path: products
            logout:
                path: logout
                target: login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: ROLE_USER }
